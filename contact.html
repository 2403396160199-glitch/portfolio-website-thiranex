<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Parth Bharvad through accessible contact form.">

    <title>Contact | Parth Bharvad</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to Main Content</a>

<header>
    <nav aria-label="Main Navigation">
        <h1>Parth Bharvad</h1>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
    </nav>
</header>

<main id="main-content">

    <section>
        <h2>Contact Me</h2>

        <form>

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                aria-required="true"
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                aria-required="true"
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                required
                aria-required="true"
            ></textarea>

            <button type="submit">Send Message</button>

        </form>
    </section>

</main>

<footer>
    <p>© 2026 Parth Bharvad. All Rights Reserved.</p>
</footer>

</body>
</html>
